# ── External SonarCloud scanner pipeline (bot-owned, separate project) ────────
# A standalone GitLab project whose ONLY job is to clone the reviewed repo and
# scan it into SonarCloud. The reviewed project is NEVER modified (cloned
# read-only). SonarCloud can't auto-scan GitLab, so this pipeline is the scanner.
# It's the "SonarQube pipeline" of the bot's three checks: the quality bot
# TRIGGERS it per MR, waits, then reads the result and posts the table.
#
# Runner: uses the sonar-scanner-cli Docker IMAGE, which runs on GitLab's shared
# runners — that's GitLab running the container, not you. No tags needed.
#
# Wiring: create this project in GitLab, add a pipeline trigger token
# (Settings → CI/CD → Pipeline trigger tokens), then set on the BOT (Render):
#   SONAR_SCAN_PROJECT_ID     this project's numeric id
#   SONAR_SCAN_TRIGGER_TOKEN  the trigger token
# The bot passes TARGET_REPO / TARGET_REF / SONAR_PROJECT_KEY / MR_IID / TARGET_BASE
# and self-provisions the SonarCloud project first, so a first scan won't 404.
#
# Set once on THIS project (Settings → CI/CD → Variables, masked):
#   SONAR_TOKEN   SonarCloud token (upload)
#   SONAR_ORG     SonarCloud organization key (e.g. vissz28)
#   TARGET_TOKEN  a GitLab token (read_repository) that can clone the target repo
#
# Manual trigger (for testing without the bot):
#   curl -X POST \
#     -F token=$TRIGGER_TOKEN -F ref=main \
#     -F "variables[TARGET_REPO]=gitlab.com/group/app.git" \
#     -F "variables[TARGET_REF]=$SOURCE_BRANCH" \
#     -F "variables[SONAR_PROJECT_KEY]=vissz28_analytics-charting-package" \
#     -F "variables[MR_IID]=14" \
#     https://gitlab.com/api/v4/projects/<runner_project_id>/trigger/pipeline

stages:
  - prepare
  - scan

# Job 1 — create the SonarCloud project (idempotent) so the scan never hits
# "component not found". "already exists" (HTTP 400) is treated as success.
create-sonar-project:
  stage: prepare
  image: curlimages/curl:latest
  script:
    - |
      HTTP=$(curl -sS -o /tmp/out -w "%{http_code}" -u "$SONAR_TOKEN:" \
        -X POST "https://sonarcloud.io/api/projects/create" \
        -d "organization=$SONAR_ORG" \
        -d "project=$SONAR_PROJECT_KEY" \
        -d "name=$SONAR_PROJECT_KEY")
      cat /tmp/out
      if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then echo "created"; \
      elif [ "$HTTP" = "400" ] && grep -qi "exist" /tmp/out; then echo "already exists — ok"; \
      else echo "create failed ($HTTP)"; exit 1; fi
  rules:
    - if: $TARGET_REPO

# Job 2 — clone the reviewed repo and scan it into that project.
sonar-scan:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest   # shared runners run this image
  variables:
    GIT_STRATEGY: none            # we clone the TARGET repo ourselves, not this one
  before_script:
    - command -v git >/dev/null 2>&1 || apk add --no-cache git
  script:
    # Full clone (all branches/history) so SonarCloud gets accurate blame /
    # new-code and, for PRs, the base branch to diff against.
    - git clone "https://oauth2:${TARGET_TOKEN}@${TARGET_REPO}" target
    - cd target && git checkout "$TARGET_REF" && cd ..
    - |
      if [ -n "$MR_IID" ]; then
        SCOPE="-Dsonar.pullrequest.key=$MR_IID -Dsonar.pullrequest.branch=$TARGET_REF -Dsonar.pullrequest.base=${TARGET_BASE:-main}"
      else
        SCOPE="-Dsonar.branch.name=$TARGET_REF"
      fi
    - cd target
    - >
      sonar-scanner
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.organization=$SONAR_ORG
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.sources=.
      -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/vendor/**,**/*.min.js,**/*.map
      $SCOPE
      -Dsonar.qualitygate.wait=true
  rules:
    - if: $TARGET_REPO            # only run when triggered with a target
