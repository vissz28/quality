# ── External SonarCloud scanner pipeline (bot-owned) ─────────────────────────
# A standalone GitLab project whose ONLY job is to scan a target repo and upload
# results to SonarCloud. Keeps the reviewed project's CI untouched. This is the
# "SonarQube pipeline" of the bot's three checks — the quality bot TRIGGERS it
# automatically per MR (via GitLab's trigger API), waits for it to finish, then
# reads the result (pullRequest → branch → default) and posts the table.
#
# Wiring: create this project in GitLab, add a pipeline trigger token
# (Settings → CI/CD → Pipeline trigger tokens), then set on the BOT (Render):
#   SONAR_SCAN_PROJECT_ID     this project's numeric id
#   SONAR_SCAN_TRIGGER_TOKEN  the trigger token
# The bot passes TARGET_REPO / TARGET_REF / SONAR_PROJECT_KEY / MR_IID for you.
#
# Set once on THIS project (Settings → CI/CD → Variables, masked):
#   SONAR_TOKEN   SonarCloud token
#   SONAR_ORG     SonarCloud organization key (e.g. vissz28)
#   TARGET_TOKEN  a GitLab token (read_repository) that can clone the target repo
#
# Pipeline variables the bot sends (or set them by hand to test):
#   TARGET_REPO         host/group/repo.git of the project to scan (no scheme)
#   TARGET_REF          branch to scan (the MR source branch)
#   SONAR_PROJECT_KEY   the SonarCloud project key (e.g. vissz28_quality)
#   MR_IID              (optional) merge-request iid → scan as a PR
#   TARGET_BASE         (optional) the MR target branch → PR base (default main)
#
# NOTE: the SonarCloud project must exist first. A PR-only scan against a project
# that was never analysed fails with "Component ... of pull request N not found".
# Run one branch scan on the default branch (no MR_IID) to create + baseline it,
# then PR scans resolve.
#
# Manual trigger (for testing without the bot):
#   curl -X POST \
#     -F token=$TRIGGER_TOKEN \
#     -F ref=main \
#     -F "variables[TARGET_REPO]=gitlab.com/group/app.git" \
#     -F "variables[TARGET_REF]=$SOURCE_BRANCH" \
#     -F "variables[SONAR_PROJECT_KEY]=vissz28_quality" \
#     -F "variables[MR_IID]=$MR_IID" \
#     -F "variables[TARGET_BASE]=main" \
#     https://gitlab.com/api/v4/projects/<runner_project_id>/trigger/pipeline

stages:
  - scan

sonar-scan:
  stage: scan
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    GIT_STRATEGY: none          # we clone the TARGET repo ourselves, not this one
  script:
    # Full clone (all branches, full history) so SonarCloud can compute accurate
    # blame / new-code and, for PRs, diff the source against the base branch.
    - git clone "https://oauth2:${TARGET_TOKEN}@${TARGET_REPO}" target
    - cd target
    - git checkout "$TARGET_REF"
    - |
      if [ -n "$MR_IID" ]; then
        SCOPE="-Dsonar.pullrequest.key=$MR_IID -Dsonar.pullrequest.branch=$TARGET_REF -Dsonar.pullrequest.base=${TARGET_BASE:-main}"
      else
        SCOPE="-Dsonar.branch.name=$TARGET_REF"
      fi
    - sonar-scanner
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.organization=$SONAR_ORG
        -Dsonar.projectKey=$SONAR_PROJECT_KEY
        -Dsonar.token=$SONAR_TOKEN
        -Dsonar.sources=.
        $SCOPE
        -Dsonar.qualitygate.wait=true
  rules:
    - if: $TARGET_REPO   # only run when triggered with a target
