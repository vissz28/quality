services:
  testgen:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Execute generated Playwright tests on the Node.js runner service.
      RUNNER_URL: http://runner:3000
      # Set SONARQUBE_URL in .env to the SonarQube/SonarCloud server the bot reads
      # (e.g. https://sonarcloud.io). Falls back to the bundled local server only
      # when you start it with `--profile self-sonar`. SONARQUBE_TOKEN and
      # SONARQUBE_PROJECT_KEY also come from .env.
      SONARQUBE_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
    depends_on:
      - runner
    restart: unless-stopped

  runner:
    build: ./runner
    expose:
      - "3000"
    restart: unless-stopped

  # Local SonarQube server. First boot takes ~1–2 min; until it's up the
  # SonarQube step is advisory (never blocks). Create a token in the UI
  # (My Account → Security) and put it in .env as SONARQUBE_TOKEN.
  # Bundled local SonarQube — optional. Only starts with `--profile self-sonar`.
  # Using SonarCloud / a hosted server instead? Leave this off and set SONARQUBE_URL.
  sonarqube:
    image: sonarqube:community
    profiles: ["self-sonar"]
    depends_on:
      - sonardb
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    # SonarQube's embedded Elasticsearch needs a higher mmap limit and file-
    # descriptor ceiling. On Linux hosts also set: sysctl -w vm.max_map_count=262144
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  sonardb:
    image: postgres:15
    profiles: ["self-sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonardb_data:
